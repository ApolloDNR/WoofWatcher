name: WoofWatcher Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Install, Test, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused behavior tests
        run: pnpm run test:focused

      - name: Typecheck and CI-safe builds
        run: pnpm run build:ci
