name: WoofWatcher Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: woofwatcher-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, Test, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24
          cache: pnpm

      - name: Verify pinned toolchain
        run: test "$(pnpm --version)" = "10.24.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile beta doctor
        run: pnpm run doctor:mobile-beta:json

      - name: Validate store materials
        run: node docs/release/tools/validate-store-materials.mjs

      - name: Run focused behavior tests
        run: pnpm run test:focused

      - name: Typecheck and CI-safe builds
        run: pnpm run build:ci

      - name: Build consumer release candidate preview
        env:
          WOOFWATCHER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: pnpm run build:candidate

      - name: Package exact-head candidate preview
        run: tar -czf woofwatcher-web-candidate.tgz -C artifacts/woofwatcher-mobile/.expo-smoke .

      - name: Preserve exact-head candidate preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: woofwatcher-web-candidate-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: woofwatcher-web-candidate.tgz
          if-no-files-found: error
          retention-days: 7
