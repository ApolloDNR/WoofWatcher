name: WoofWatcher Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Install, Test, Typecheck, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API clients
        run: |
          pnpm --filter @workspace/api-spec exec orval --config ./orval.config.ts
          pnpm exec prettier --write lib/api-client-react/src/generated lib/api-zod/src/generated
          git diff --exit-code -- lib/api-client-react/src/generated lib/api-zod/src/generated
          generated_status="$(git status --porcelain --untracked-files=all -- lib/api-client-react/src/generated lib/api-zod/src/generated)"
          if [ -n "$generated_status" ]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

      - name: Run mobile beta doctor
        run: pnpm run doctor:mobile-beta:json

      - name: Run focused behavior tests
        run: pnpm run test:focused

      - name: Typecheck and CI-safe builds
        run: pnpm run build:ci
