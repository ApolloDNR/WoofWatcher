kind = "web"
previewPath = "/"
title = "WoofWatcher"
version = "1.0.0"
id = "artifacts/woofwatcher"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22597

[services.development]
run = "pnpm --filter @workspace/woofwatcher run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/woofwatcher", "run", "build" ]
publicDir = "artifacts/woofwatcher/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22597"
BASE_PATH = "/"
