openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: care-helper
    description: WoofWatcher AI care assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /care-helper:
    get:
      operationId: getCareHelperStatus
      tags: [care-helper]
      summary: Get AI care helper status
      description: Returns whether OpenAI is configured and what mode is active
      responses:
        "200":
          description: Status info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareHelperStatus"
    post:
      operationId: askCareHelper
      tags: [care-helper]
      summary: Ask the AI care helper a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareHelperInput"
      responses:
        "200":
          description: AI answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareHelperAnswer"
        "501":
          description: OpenAI not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareHelperError"
        "502":
          description: OpenAI request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareHelperError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CareHelperStatus:
      type: object
      properties:
        configured:
          type: boolean
        mode:
          type: string
        model:
          type: string
        boundary:
          type: string
      required:
        - configured
        - mode
    CareHelperInput:
      type: object
      properties:
        question:
          type: string
        context:
          type: object
          additionalProperties: true
    CareHelperAnswer:
      type: object
      properties:
        answer:
          type: string
        mode:
          type: string
        model:
          type: string
        requestId:
          type: ["string", "null"]
      required:
        - answer
        - mode
    CareHelperError:
      type: object
      properties:
        error:
          type: string
        mode:
          type: string
        boundary:
          type: string
      required:
        - error
        - mode
