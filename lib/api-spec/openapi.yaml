openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: care-helper
    description: WoofWatcher AI care assistant
  - name: woofguide-events
    description: Dog-friendly outing suggestions for WoofGuide and Adventure Mode
  - name: avatar
    description: Avatar Studio image generation helpers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /care-helper:
    get:
      operationId: getCareHelperStatus
      tags: [care-helper]
      summary: Get AI care helper status
      description: Returns whether the provider-backed or local care-helper mode is active.
      responses:
        "200":
          description: Status info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareHelperStatus"
    post:
      operationId: askCareHelper
      tags: [care-helper]
      summary: Ask the AI care helper a question
      description: >-
        Asks the authenticated WoofGuide care helper a dog-care question. When
        the provider is unavailable, the API returns a truthful local fallback
        response instead of claiming live AI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareHelperInput"
      responses:
        "200":
          description: Provider-backed or local care-helper answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareHelperAnswer"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Provider-backed care-helper question rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareHelperError"
  /woofguide-events:
    get:
      operationId: getWoofguideEventsStatus
      tags: [woofguide-events]
      summary: Get WoofGuide events provider status
      description: >-
        Returns whether provider-backed dog-friendly event curation is
        configured. When unavailable, the API falls back to local curated
        suggestions instead of claiming live provider data.
      responses:
        "200":
          description: WoofGuide events provider status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WoofguideEventsStatus"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWoofguideEvents
      tags: [woofguide-events]
      summary: Create dog-friendly WoofGuide event suggestions
      description: >-
        Creates owner-reviewed outing ideas for a household dog. Suggestions are
        inspirational and not bookings, addresses, prices, or provider-verified
        events.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WoofguideEventsInput"
      responses:
        "200":
          description: Local or provider-backed event suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WoofguideEventsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /avatar-stylize:
    post:
      operationId: stylizeAvatar
      tags: [avatar]
      summary: Create a stylized dog avatar portrait
      description: >-
        Generates an owner-reviewed stylized portrait from a dog photo when the
        image provider is configured. This is a helper for Avatar Studio and
        must not be represented as automatic identity verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarStylizeInput"
      responses:
        "200":
          description: Generated portrait image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarStylizeResponse"
        "400":
          description: Missing image payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Image provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Image provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /avatar-emotions:
    post:
      operationId: createAvatarEmotions
      tags: [avatar]
      summary: Create a set of stylized dog avatar emotion portraits
      description: >-
        Generates a small owner-reviewed emotion set for the same dog from one
        photo when the image provider is configured. Some emotions can fail
        independently and are returned in the errors map.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarEmotionsInput"
      responses:
        "200":
          description: Generated emotion image set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarEmotionsResponse"
        "400":
          description: Missing image payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Image too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Image provider is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Image provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /me:
    get:
      operationId: getMe
      tags: [household]
      summary: Get the current user, their household and members
      description: >-
        Returns the authenticated user. On first call this JIT-provisions the
        user, a default household, and a membership.
      responses:
        "200":
          description: Current user context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user no longer has valid access to the active household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Active household identity or membership authority is internally inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateMe
      tags: [household]
      summary: Update the current user's profile / display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeUpdate"
      responses:
        "200":
          description: Updated user context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid profile update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user no longer has valid access to the active household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Active household identity or membership authority changed during the update or exact response snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /household:
    patch:
      operationId: updateHousehold
      tags: [household]
      summary: Rename the current household
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdUpdate"
      responses:
        "200":
          description: Updated household context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Invalid household update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Only the household owner can rename the household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority changed during rename or response construction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/memberships:
    get:
      operationId: listMyHouseholdMemberships
      tags: [household]
      summary: List the authenticated user's switchable households
      description: >-
        Returns only the authenticated user's currently valid household
        memberships. The expected-household capability is compared exactly
        with the persisted active source before any membership rows are
        exposed. Expired helper access and unknown legacy roles are omitted.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      responses:
        "200":
          description: Safe retained-household choices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyHouseholdMembershipList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Authenticated household identity is unprovisioned or membership authority is internally inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/activate:
    post:
      operationId: activateHousehold
      tags: [household]
      summary: Activate one retained household membership
      description: >-
        Atomically moves the authenticated user's active pointer from the exact
        expected source to a currently valid target membership. The target is
        revalidated inside the source-CAS transaction, and the response is an
        exact target household snapshot rather than guessed client state.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdActivationInput"
      responses:
        "200":
          description: Exact newly active household context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Malformed household activation target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Target membership is missing, revoked, expired, or otherwise unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority changed during activation or exact response construction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/invitations:
    get:
      operationId: listHouseholdInvitations
      tags: [household]
      summary: List household invitations
      description: >-
        Owner/admin-only review of provider-durable household invitation
        lifecycle rows scoped to the authenticated active household. Production
        Supabase migration, RLS, retention, export/deletion policy, and
        notification delivery remain launch approval gates.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: lifecycleState
          in: query
          schema:
            $ref: "#/components/schemas/HouseholdInvitationLifecycleState"
      responses:
        "200":
          description: Durable household invitation review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdInvitationListResponse"
        "400":
          description: Invalid invitation review query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Only owners can review invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
    post:
      operationId: createHouseholdInvitation
      tags: [household]
      summary: Create a household invitation
      description: >-
        Owner/admin-only creation of provider-durable invitation rows. New
        invitations may start approved or pending owner approval, and the join
        flow only creates caregiver memberships after the row is approved and
        unexpired.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInvitationCreateInput"
      responses:
        "201":
          description: Household invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdInvitationMutationResponse"
        "400":
          description: Invalid invitation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Only owners can create invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority or invitation state changed before the atomic create completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/invitations/{id}/revoke:
    post:
      operationId: revokeHouseholdInvitation
      tags: [household]
      summary: Revoke a household invitation
      description: >-
        Owner/admin-only revocation of a provider-durable invitation before
        acceptance. Accepted invitations are terminal; remove accepted access
        through the household member revocation route. The returned invitation
        reflects the revoked lifecycle state and includes the household audit
        event for owner review.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInvitationRevokeInput"
      responses:
        "200":
          description: Household invitation revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdInvitationMutationResponse"
        "400":
          description: Invalid invitation revoke payload or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Only owners can revoke invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Household invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Invitation was already accepted or otherwise reached a terminal lifecycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/join:
    post:
      operationId: joinHousehold
      tags: [household]
      summary: Join an existing household by invite code
      description: >-
        Accepts only a provider-durable invitation code, creates or reuses the
        caregiver membership, and returns the persisted HouseholdAuditEvent for
        invitation acceptance. The expected-household capability identifies the
        exact source household and is compared again inside the join transaction.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinHouseholdInput"
      responses:
        "200":
          description: Joined household context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdJoinResponse"
        "400":
          description: Invalid invite payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Invitation is not approved for this authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Invite code not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household membership or active authority changed during join
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
        "503":
          description: Provider-backed household join storage is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /household/members/{id}:
    patch:
      operationId: updateHouseholdMember
      tags: [household]
      summary: Update a household member role or display name
      description: >-
        Owner/admin-only helper management for household roles, sitter/trainer
        scopes, and vet viewer read-only access. This is the server contract
        foundation for future Access Pass enforcement.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdMemberUpdate"
      responses:
        "200":
          description: Updated household context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMemberMutationResponse"
        "400":
          description: Invalid member update payload or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to update household members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Household member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority changed while constructing the response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
    delete:
      operationId: revokeHouseholdMember
      tags: [household]
      summary: Revoke a household member from the current household
      description: >-
        Owner/admin-only helper revocation. Self-revocation and protected owner
        role changes remain blocked until last-owner-safe account flows exist.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Household member revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdMemberMutationResponse"
        "400":
          description: Invalid member id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to revoke household members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Household member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority changed while constructing the response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/access-passes/activate:
    post:
      operationId: activateHouseholdAccessPass
      tags: [household]
      summary: Activate an Access Pass helper role for a household member
      description: >-
        Owner/admin-only helper activation for existing household members. This
        assigns a sitter, trainer, walker, or vet viewer role and returns helper
        audit trail metadata backed by the durable provider audit contract.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessPassActivationInput"
      responses:
        "200":
          description: Access Pass helper role activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdAccessPassMutationResponse"
        "400":
          description: Invalid Access Pass activation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to activate Access Pass helpers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Household member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority changed while constructing the response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/access-passes/revoke:
    post:
      operationId: revokeHouseholdAccessPass
      tags: [household]
      summary: Revoke an Access Pass helper role
      description: >-
        Owner/admin-only helper revocation for active sitter, trainer, walker,
        and vet viewer roles. Core household members should use the normal
        member-management flow instead.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessPassRevocationInput"
      responses:
        "200":
          description: Access Pass helper access revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdAccessPassMutationResponse"
        "400":
          description: Invalid Access Pass revocation payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to revoke Access Pass helpers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Household member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority changed while constructing the response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/sharing-cleanup:
    get:
      operationId: listHouseholdSharingCleanup
      tags: [household]
      summary: Review expired household sharing cleanup candidates
      description: >-
        Owner/admin-only, non-destructive review of expired invitation rows and
        expired Access Pass helper memberships scoped to the authenticated
        active household. This endpoint does not revoke, delete, or mutate
        household access; applying cleanup, production Supabase migration/RLS,
        retention/export/deletion policy, notification delivery, and
        legal/privacy approval remain launch gates.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/HouseholdSharingCleanupKind"
      responses:
        "200":
          description: Expired household sharing cleanup review candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdSharingCleanupResponse"
        "400":
          description: Invalid sharing cleanup query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to review household sharing cleanup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /household/audit-events:
    get:
      operationId: listHouseholdAuditEvents
      tags: [household]
      summary: List durable household audit events
      description: >-
        Owner/admin-only review of durable household invitation, role, and
        Access Pass audit rows scoped to the authenticated active household.
        Production migration, RLS, retention, export, and deletion policy remain
        launch approval gates.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: action
          in: query
          schema:
            type: string
            enum:
              - invitation-created
              - invitation-accepted
              - invitation-revoked
              - member-role-updated
              - member-revoked
              - access-pass-activated
              - access-pass-revoked
        - name: lifecycleState
          in: query
          schema:
            type: string
            enum:
              - invite-created
              - invite-accepted
              - invite-revoked
              - member-updated
              - member-revoked
              - access-pass-active
              - access-pass-revoked
              - access-pass-expired
      responses:
        "200":
          description: Durable household audit review rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HouseholdAuditEventListResponse"
        "400":
          description: Invalid audit review query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to review household audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /care-state:
    get:
      operationId: getCareState
      tags: [care-state]
      summary: Get the household's synced care document
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      responses:
        "200":
          description: Care state document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareStateEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user has no valid role in the expected household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Care state document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority became internally inconsistent before the read completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
    put:
      operationId: putCareState
      tags: [care-state]
      summary: Replace the household's synced care document
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareStateInput"
      responses:
        "200":
          description: Updated care state document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareStateEnvelope"
        "400":
          description: Invalid care state payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated household role is not allowed to update shared Care state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Care state document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Version conflict or household authority integrity failure; refetch before retrying
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CareStateEnvelope"
                  - $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /care-entries:
    get:
      operationId: listCareEntries
      tags: [care-entries]
      summary: List the household's care log entries
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: since
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: updatedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 250
      responses:
        "200":
          description: Care entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareEntry"
        "400":
          description: Invalid care-entry list query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user has no valid role in the expected household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority became internally inconsistent before the list completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
    post:
      operationId: createCareEntry
      tags: [care-entries]
      summary: Append a care log entry
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareEntryInput"
      responses:
        "200":
          description: Existing entry returned after an idempotent create retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEntry"
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEntry"
        "400":
          description: Invalid care entry payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to create shared care logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority became internally inconsistent before the create completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          description: The creator-scoped client key belongs to a durably deleted care entry and must not be retried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEntryCreateRevoked"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /care-entries/tombstones:
    get:
      operationId: listCareEntryTombstones
      tags: [care-entries]
      summary: List deleted care log tombstones for household sync
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: updatedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 250
      responses:
        "200":
          description: Deleted care-entry tombstones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareEntryTombstone"
        "400":
          description: Invalid care-entry tombstone list query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user has no valid role in the expected household
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority became internally inconsistent before the tombstone list completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /care-entries/client-key/{clientKey}:
    delete:
      operationId: deleteCareEntryByClientKey
      tags: [care-entries]
      summary: Commit deletion of a creator-scoped care entry client identity
      description: Deletes the authenticated creator's matching live row when present and durably revokes the normalized client key even when the create has not committed yet.
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: clientKey
          in: path
          required: true
          description: Opaque client-generated idempotency identity, normalized by the server and scoped to the authenticated creator and exact expected household.
          schema:
            type: string
            minLength: 1
      responses:
        "204":
          description: The creator-scoped deletion intent is durably committed
        "400":
          description: Invalid or empty care entry client key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to delete shared care logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority became internally inconsistent before the deletion intent completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
  /care-entries/{id}:
    patch:
      operationId: updateCareEntry
      tags: [care-entries]
      summary: Update a care log entry (e.g. add a quick note)
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareEntryUpdate"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareEntry"
        "400":
          description: Invalid care entry update payload or id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to update shared care logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A newer care entry update exists or household authority became internally inconsistent
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/CareEntryConflict"
                  - $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
    delete:
      operationId: deleteCareEntry
      tags: [care-entries]
      summary: Delete a care log entry
      parameters:
        - $ref: "#/components/parameters/ExpectedHouseholdId"
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid care entry id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Role is not allowed to delete shared care logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "412":
          $ref: "#/components/responses/ExpectedHouseholdMismatch"
        "428":
          $ref: "#/components/responses/ExpectedHouseholdRequired"
        "404":
          description: Entry not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Household authority became internally inconsistent before the delete completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    ExpectedHouseholdId:
      name: X-WoofWatcher-Expected-Household-Id
      in: header
      required: true
      description: Exact opaque active household identity previously resolved by the authenticated client. Values are compared byte-for-byte and are never trimmed or case-folded.
      schema:
        type: string
        minLength: 1
        pattern: '.*\S.*'
  responses:
    ExpectedHouseholdMismatch:
      description: The authenticated user's active household no longer matches the expected household.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ExpectedHouseholdRequired:
      description: An exact expected-household capability is required before accessing household-scoped data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CareHelperStatus:
      type: object
      properties:
        configured:
          type: boolean
        mode:
          type: string
        model:
          type: string
        boundary:
          type: string
      required:
        - configured
        - mode
    CareHelperInput:
      type: object
      properties:
        question:
          type: string
        context:
          type: object
          additionalProperties: true
    CareHelperAnswer:
      type: object
      properties:
        answer:
          type: string
        mode:
          type: string
        model:
          type: string
        requestId:
          type: ["string", "null"]
      required:
        - answer
        - mode
    CareHelperError:
      type: object
      properties:
        error:
          type: string
        mode:
          type: string
        boundary:
          type: string
      required:
        - error
        - mode
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    WoofguideEventsStatus:
      type: object
      properties:
        configured:
          type: boolean
        model:
          type: string
      required:
        - configured
        - model
    WoofguideEventsProfile:
      type: object
      properties:
        name:
          type: string
        breed:
          type: string
        careFocus:
          type: string
        background:
          type: string
    WoofguideEventsInput:
      type: object
      properties:
        location:
          type: string
        profile:
          $ref: "#/components/schemas/WoofguideEventsProfile"
    WoofguideEvent:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
        date:
          type: string
          format: date
        time:
          type: string
        location:
          type: string
        note:
          type: string
      required:
        - title
        - type
        - date
        - location
    WoofguideEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/WoofguideEvent"
        mode:
          type: string
      required:
        - events
        - mode
    AvatarStylizeInput:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
      required:
        - imageBase64
    AvatarStylizeResponse:
      type: object
      properties:
        imageBase64:
          type: string
        mimeType:
          type: string
      required:
        - imageBase64
        - mimeType
    AvatarEmotionImage:
      type: object
      properties:
        imageBase64:
          type: string
        mimeType:
          type: string
      required:
        - imageBase64
        - mimeType
    AvatarEmotionsInput:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 1
        mimeType:
          type: string
      required:
        - imageBase64
    AvatarEmotionsResponse:
      type: object
      properties:
        images:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AvatarEmotionImage"
        errors:
          type: object
          additionalProperties:
            type: string
      required:
        - images
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
      required:
        - id
    Household:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        inviteCode:
          type: string
          description: Deprecated compatibility field. Always empty; durable HouseholdInvitation rows are the only production join credentials.
          deprecated: true
          maxLength: 0
      required:
        - id
        - name
        - inviteCode
    HouseholdMemberRole:
      type: string
      description: Canonical household membership role shared by household, invitation, and retained-membership contracts.
      enum: [owner, adult, teen, kid, sitter, trainer, walker, vet viewer]
    HouseholdMemberUpdateRole:
      description: Deprecated compatibility alias for HouseholdMemberRole. New consumers should use HouseholdMemberRole.
      deprecated: true
      allOf:
        - $ref: "#/components/schemas/HouseholdMemberRole"
    MyHouseholdMembershipRole:
      description: Deprecated compatibility alias for HouseholdMemberRole. New consumers should use HouseholdMemberRole.
      deprecated: true
      allOf:
        - $ref: "#/components/schemas/HouseholdMemberRole"
    Member:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/HouseholdMemberRole"
        displayName:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        isSelf:
          type: boolean
        accessPassExpiresAt:
          type: ["string", "null"]
          description: Active Access Pass expiry for a temporary helper. At this instant all household access ends until an owner grants a new pass.
        accessPassExpired:
          type: boolean
          description: True when a temporary helper's Access Pass has lapsed and writes should be blocked until renewed.
      required:
        - id
        - userId
        - role
        - isSelf
    Me:
      type: object
      properties:
        authorityObservedAt:
          type: string
          format: date-time
          description: Exact transactional database-clock instant used to evaluate Access Pass expiry for this authority snapshot. Clients must pair it with a monotonic request interval and must not substitute device wall-clock time.
        user:
          $ref: "#/components/schemas/User"
        household:
          $ref: "#/components/schemas/Household"
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
      required:
        - authorityObservedAt
        - user
        - household
        - members
    HouseholdAuditEvent:
      type: object
      properties:
        id:
          type: string
        action:
          type: string
          enum:
            - invitation-created
            - invitation-accepted
            - invitation-revoked
            - member-role-updated
            - member-revoked
            - access-pass-activated
            - access-pass-revoked
        lifecycleState:
          type: string
          enum:
            - invite-created
            - invite-accepted
            - invite-revoked
            - member-updated
            - member-revoked
            - access-pass-active
            - access-pass-revoked
            - access-pass-expired
        actorUserId:
          type: string
        householdId:
          type: string
        targetMemberId:
          type: ["string", "null"]
        targetUserId:
          type: ["string", "null"]
        targetRole:
          type: ["string", "null"]
        nextRole:
          type: ["string", "null"]
        reason:
          type: ["string", "null"]
        note:
          type: ["string", "null"]
        expiresAt:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        storage:
          type: string
          enum: [provider-durable]
        boundary:
          type: string
      required:
        - id
        - action
        - lifecycleState
        - actorUserId
        - householdId
        - createdAt
        - storage
        - boundary
    HouseholdJoinResponse:
      allOf:
        - $ref: "#/components/schemas/Me"
        - type: object
          properties:
            auditEvent:
              $ref: "#/components/schemas/HouseholdAuditEvent"
          required:
            - auditEvent
    HouseholdMemberMutationResponse:
      allOf:
        - $ref: "#/components/schemas/Me"
        - type: object
          properties:
            auditEvent:
              $ref: "#/components/schemas/HouseholdAuditEvent"
          required:
            - auditEvent
    HouseholdAuditEventListFilters:
      type: object
      properties:
        action:
          type: string
          enum:
            - invitation-created
            - invitation-accepted
            - invitation-revoked
            - member-role-updated
            - member-revoked
            - access-pass-activated
            - access-pass-revoked
        lifecycleState:
          type: string
          enum:
            - invite-created
            - invite-accepted
            - invite-revoked
            - member-updated
            - member-revoked
            - access-pass-active
            - access-pass-revoked
            - access-pass-expired
    HouseholdAuditEventListResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/HouseholdAuditEvent"
        limit:
          type: integer
        filters:
          $ref: "#/components/schemas/HouseholdAuditEventListFilters"
        boundary:
          type: string
      required:
        - events
        - limit
        - filters
        - boundary
    HouseholdInvitationLifecycleState:
      type: string
      enum:
        - pending-approval
        - approved
        - accepted
        - revoked
        - expired
        - rejected
    HouseholdInvitation:
      type: object
      properties:
        id:
          type: string
        householdId:
          type: string
        inviteCode:
          type: string
        invitedEmail:
          type: ["string", "null"]
        invitedUserId:
          type: ["string", "null"]
        role:
          $ref: "#/components/schemas/HouseholdMemberRole"
        lifecycleState:
          $ref: "#/components/schemas/HouseholdInvitationLifecycleState"
        runtimeLifecycleState:
          $ref: "#/components/schemas/HouseholdInvitationLifecycleState"
